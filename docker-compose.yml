      - PHILOSOPHER_ID=philosopher-1
      - LEFT_FORK_ID=1
      - RIGHT_FORK_ID=0
      - TABLE_SERVICE_URL=http://table-service:8080
      - RABBITMQ_HOST=rabbitmq
      - SIMULATION_DURATION_MINUTES=1
    depends_on:
      table-service:
        condition: service_healthy
      coordinator-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8082:8082"

  philosopher-2:
