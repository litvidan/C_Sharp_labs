services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  table-service:
    build:
      context: .
      dockerfile: DiningPhilosophers.TableService/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - PHILOSOPHERS_COUNT=5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  coordinator-service:
    build:
      context: .
      dockerfile: DiningPhilosophers.CoordinatorService/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8090
      - RABBITMQ_HOST=rabbitmq
      - PHILOSOPHERS_COUNT=5 # Added this line
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  philosopher-0:
    build:
      context: .
      dockerfile: DiningPhilosophers.PhilosopherService/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8081
      - PHILOSOPHER_NAME=Socrates
      - PHILOSOPHER_ID=philosopher-0
      - LEFT_FORK_ID=0
      - RIGHT_FORK_ID=4
      - TABLE_SERVICE_URL=http://table-service:8080
      - RABBITMQ_HOST=rabbitmq
      - SIMULATION_DURATION_MINUTES=1
    depends_on:
      table-service:
        condition: service_healthy
      coordinator-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8081:8081"

  philosopher-1:
